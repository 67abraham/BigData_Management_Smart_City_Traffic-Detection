# Data contract (spec T07, §7). Hand-written part; the `release` block at the end is generated by
# src/products/release.py from the build and read-back reports of a recorded run.
name: traffic_hourly
version: v1
release_level: R1   # verified student-produced version (spec §7); no course R0 baseline was supplied for this dataset
description: >
  Hourly westbound traffic volume on I-94 at MnDOT ATR station 301 (Minneapolis-St Paul), one row per
  accepted UCI hour, with UCI's own weather fields and ERA5 reanalysis weather aligned to the same hour.
consumers: [historical analytics, ML (via traffic_features_v1), dashboard]
location:
  path: hdfs://namenode:8020/datalake/gold/products/traffic_hourly/v1/
  format: parquet
  partitioning: [year]          # local calendar year of hour_start_local
granularity: one row per (station, hour); the hour is [hour_start_utc, hour_start_utc + 1 h)
primary_key: [station_id, hour_start_utc]
time_semantics: >
  UCI gives date_time as "Hour of the data collected in local CST time"; the data follows US Central time
  with daylight saving (the spring-forward 02:00 hour never occurs), so it is read as America/Chicago and
  converted to UTC (hour_start_utc). date_time is assumed to be the START of the hour (UCI does not say).
  The ambiguous fall-back hours (4) were quarantined in Silver and are not in this product. ERA5 values:
  instantaneous variables at hour_start_utc, precipitation/snowfall summed over the same hour.
spatial_coverage: >
  One point: ATR 301, I-94 westbound, 44.9516214 N 93.1368848 W (MnDOT CONTINUOUS_COLLECTION_SITES via
  ArcGIS Hub; site listed as Retired). ERA5 grid cell 45.00 N 93.25 W (0.25 deg), which contains the station.
temporal_coverage: 2012-10-02 to 2018-09-30 local, hourly with gaps (see release.temporal_coverage)
sources:
  - name: UCI Metro Interstate Traffic Volume
    url: https://archive.ics.uci.edu/dataset/492/metro+interstate+traffic+volume
    licence: CC BY 4.0 (DOI 10.24432/C5X60B)
  - name: Open-Meteo Historical Weather API (ERA5 reanalysis)
    url: https://open-meteo.com/en/docs/historical-weather-api
    licence: CC BY 4.0 ("Weather data by Open-Meteo.com"); ERA5 contains modified Copernicus Climate Change Service information
licence: CC BY 4.0 for both inputs; attribute UCI (Hogue, DOI 10.24432/C5X60B) and Open-Meteo / Copernicus C3S
lineage: Bronze uci_metro + open_meteo -> Silver uci_traffic_hourly v1, open_meteo_hourly v1 -> Gold uci_traffic_weather_hourly v1 -> this product
fields:
  - {name: station_id, type: string, nullable: false, description: "MnDOT ATR station id (\"301\")"}
  - {name: road, type: string, nullable: false, description: "road (\"I-94\")"}
  - {name: direction, type: string, nullable: false, description: "counted direction (\"westbound\")"}
  - {name: latitude, type: double, unit: degrees_north, nullable: false, description: "station latitude (WGS 84, MnDOT)"}
  - {name: longitude, type: double, unit: degrees_east, nullable: false, description: "station longitude (WGS 84, MnDOT)"}
  - {name: hour_start_utc, type: timestamp, nullable: false, description: "start of the hour in UTC (key)"}
  - {name: hour_start_local, type: timestamp_ntz, nullable: false, description: "start of the hour as UCI gives it, local wall clock"}
  - {name: timezone, type: string, nullable: false, description: "IANA zone used to interpret hour_start_local (\"America/Chicago\")"}
  - {name: utc_offset_hours, type: int, unit: hours, nullable: false, description: "local - UTC: -5 (CDT) or -6 (CST)"}
  - {name: local_date, type: date, nullable: false, description: "local calendar date"}
  - {name: traffic_volume, type: int, unit: vehicles/hour, nullable: false, description: "hourly westbound volume reported by ATR 301 (UCI target)"}
  - {name: traffic_volume_unit, type: string, nullable: false, description: '"vehicles/hour"'}
  - {name: is_holiday_date, type: boolean, nullable: false, description: "local date is a US national / regional holiday (UCI marks it on the 00:00 row only; spread to the whole date)"}
  - {name: holiday_name, type: string, nullable: true, description: "holiday name from UCI, null on other dates"}
  - {name: uci_temp_c, type: double, unit: degC, nullable: true, description: "UCI temp converted from kelvin; null where UCI rows for the hour disagree"}
  - {name: uci_rain_1h_mm, type: double, unit: mm, nullable: true, description: "UCI rain in the hour"}
  - {name: uci_snow_1h_mm, type: double, unit: mm, nullable: true, description: "UCI snow in the hour"}
  - {name: uci_clouds_all_pct, type: double, unit: percent, nullable: true, description: "UCI cloud cover"}
  - {name: uci_weather_main, type: "array<string>", nullable: false, description: "UCI weather conditions reported for the hour (sorted set)"}
  - {name: uci_weather_conflict, type: boolean, nullable: false, description: "UCI rows of this hour disagreed on a numeric weather field (that field is null)"}
  - {name: era5_temperature_2m_c, type: double, unit: degC, nullable: true, description: "ERA5 2 m temperature at hour_start_utc (reanalysis, not a station observation)"}
  - {name: era5_precipitation_mm, type: double, unit: mm, nullable: true, description: "ERA5 precipitation summed over the hour"}
  - {name: era5_snowfall_cm, type: double, unit: cm, nullable: true, description: "ERA5 snowfall summed over the hour"}
  - {name: era5_cloud_cover_pct, type: int, unit: percent, nullable: true, description: "ERA5 cloud cover at hour_start_utc"}
  - {name: era5_weather_code, type: int, unit: WMO code, nullable: true, description: "ERA5 WMO weather code at hour_start_utc"}
  - {name: era5_wind_speed_10m_kmh, type: double, unit: km/h, nullable: true, description: "ERA5 10 m wind speed at hour_start_utc"}
  - {name: source_rows, type: bigint, nullable: false, description: "UCI source rows collapsed into this hour (UCI repeats an hour per weather condition)"}
  - {name: _silver_run_id, type: string, nullable: false, description: "run that built the Silver record"}
  - {name: _gold_run_id, type: string, nullable: false, description: "run that built the Gold join"}
  - {name: _product_run_id, type: string, nullable: false, description: "run that built this product"}
  - {name: year, type: int, nullable: false, description: "partition column, local year"}
quality_rules:   # each must hold for EVERY row; checked by the read-back test
  - {name: volume_in_range, rule: "traffic_volume BETWEEN 1 AND 10000", why: "0 and >10000 were quarantined in Silver"}
  - {name: offset_matches_zone, rule: "utc_offset_hours IN (-5, -6) AND timezone = 'America/Chicago'"}
  - {name: utc_is_local_minus_offset, rule: "hour_start_utc = to_utc_timestamp(CAST(hour_start_local AS TIMESTAMP), 'America/Chicago')"}
  - {name: era5_matched, rule: "era5_temperature_2m_c IS NOT NULL AND era5_precipitation_mm IS NOT NULL"}
  - {name: units_constant, rule: "traffic_volume_unit = 'vehicles/hour'"}
  - {name: year_matches_date, rule: "year = year(local_date)"}
production:
  command: bash scripts/run_m4.sh products   # after run_m1 (ingest), run_m2 (Silver/Gold)
  job: src/products/build_products.py --product traffic_hourly
  inputs: [hdfs:///datalake/gold/uci_traffic_weather_hourly/v1]
reading_instructions: |
  Spark:   spark.read.parquet("hdfs://namenode:8020/datalake/gold/products/traffic_hourly/v1/")
           .where("year = 2016")   # partition pruning
  Key: (station_id, hour_start_utc). Join other UTC data on hour_start_utc; group by local_date for local days.
  Hours are missing where UCI has no record (gaps, incl. 2014-08 to 2015-06); do not assume a continuous series.
known_limitations:
  - "Assumes UCI date_time is the hour start (not stated by UCI); a correlation check with ERA5 was inconclusive."
  - "11,976 hours absent in the 2012-10-02..2018-09-30 span (UCI gaps); 17 hours quarantined in Silver are excluded."
  - "UCI does not name the source of its weather columns; ERA5 is reanalysis on a ~25 km grid, not a road-side observation."
  - "Station coordinates are MnDOT's current record of ATR 301 (status Retired), matched by ID only."
  - "One station and one direction only."
