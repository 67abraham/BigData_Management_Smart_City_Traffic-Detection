# Data contract (spec T07, §7). Hand-written part; `release` is generated by src/products/release.py.
name: traffic_features
version: v1
release_level: R1   # verified student-produced version; no course R0 baseline was supplied
description: >
  ML-ready features for hourly traffic-volume prediction at ATR 301, one row per hour of traffic_hourly_v1.
  Every feature is computable at the PREDICTION TIME = hour_start_utc (the start of the hour being
  predicted): calendar features of that hour, and lags/rolling statistics of earlier hours only.
consumers: [Machine Learning course (forecasting models)]
location:
  path: hdfs://namenode:8020/datalake/gold/products/traffic_features/v1/
  format: parquet
  partitioning: [split]
granularity: one row per (station, hour)
primary_key: [station_id, hour_start_utc]
time_semantics: >
  prediction_time_utc = hour_start_utc. Target = traffic_volume of the hour [hour_start_utc, +1 h).
  lag_k_h = volume of the hour starting k hours earlier (exact UTC hour, NULL if that hour is missing).
  Rolling features use the hours in [hour_start_utc - 24 h, hour_start_utc - 1 h] only. Calendar features
  use local time (America/Chicago). No weather features: UCI's weather columns describe the target hour
  itself and ERA5 is published days later, so neither is available at prediction time.
target:
  name: target_traffic_volume
  definition: traffic_volume (vehicles/hour) of the hour starting at hour_start_utc, as in traffic_hourly_v1
temporal_split:
  description: by local date of the target hour; no shuffling across time
  train: "local_date < 2017-01-01"
  validation: "2017-01-01 <= local_date < 2018-01-01"
  test: "local_date >= 2018-01-01"
  note: lags of the first validation/test hours reach back into the previous split; they use only past values, so this is not leakage
spatial_coverage: one point, ATR 301 I-94 westbound (see traffic_hourly_v1)
temporal_coverage: as traffic_hourly_v1
sources:
  - name: traffic_hourly_v1 (this platform)
    url: contracts/traffic_hourly_v1.yaml
    licence: CC BY 4.0 (UCI)
licence: CC BY 4.0 (derived from UCI Metro Interstate Traffic Volume, DOI 10.24432/C5X60B)
lineage: traffic_hourly_v1 -> this product
fields:
  - {name: station_id, type: string, nullable: false, description: "ATR station id"}
  - {name: hour_start_utc, type: timestamp, nullable: false, description: "target hour start = prediction time (key)"}
  - {name: hour_start_local, type: timestamp_ntz, nullable: false, description: "target hour start, local wall clock"}
  - {name: local_date, type: date, nullable: false, description: "local date of the target hour"}
  - {name: target_traffic_volume, type: int, unit: vehicles/hour, nullable: false, description: "the value to predict"}
  - {name: hour_of_day, type: int, nullable: false, description: "local hour 0-23"}
  - {name: day_of_week, type: int, nullable: false, description: "1 = Monday ... 7 = Sunday (local)"}
  - {name: month, type: int, nullable: false, description: "local month 1-12"}
  - {name: is_weekend, type: boolean, nullable: false, description: "Saturday or Sunday (local)"}
  - {name: is_holiday_date, type: boolean, nullable: false, description: "holiday on the local date (calendar, known in advance)"}
  - {name: lag_1h, type: int, unit: vehicles/hour, nullable: true, description: "volume of the hour starting 1 h earlier; NULL if missing"}
  - {name: lag_2h, type: int, unit: vehicles/hour, nullable: true, description: "volume 2 h earlier"}
  - {name: lag_24h, type: int, unit: vehicles/hour, nullable: true, description: "volume 24 h earlier (same hour yesterday)"}
  - {name: lag_168h, type: int, unit: vehicles/hour, nullable: true, description: "volume 168 h earlier (same hour last week)"}
  - {name: rolling_mean_prev_24h, type: double, unit: vehicles/hour, nullable: true, description: "mean volume of the hours in [t-24 h, t-1 h]; NULL if none"}
  - {name: rolling_count_prev_24h, type: bigint, nullable: false, description: "number of hours present in that 24 h range (0-24)"}
  - {name: lags_complete, type: boolean, nullable: false, description: "lag_1h, lag_24h and lag_168h are all present"}
  - {name: _product_run_id, type: string, nullable: false, description: "run that built this product"}
  - {name: split, type: string, nullable: false, description: "train | validation | test (partition column)"}
quality_rules:
  - {name: split_matches_date, rule: "(split = 'train' AND local_date < DATE '2017-01-01') OR (split = 'validation' AND local_date >= DATE '2017-01-01' AND local_date < DATE '2018-01-01') OR (split = 'test' AND local_date >= DATE '2018-01-01')"}
  - {name: calendar_ranges, rule: "hour_of_day BETWEEN 0 AND 23 AND day_of_week BETWEEN 1 AND 7 AND month BETWEEN 1 AND 12"}
  - {name: rolling_count_range, rule: "rolling_count_prev_24h BETWEEN 0 AND 24"}
  - {name: rolling_mean_needs_count, rule: "(rolling_count_prev_24h = 0) = (rolling_mean_prev_24h IS NULL)"}
  - {name: lags_complete_consistent, rule: "lags_complete = (lag_1h IS NOT NULL AND lag_24h IS NOT NULL AND lag_168h IS NOT NULL)"}
  - {name: target_positive, rule: "target_traffic_volume BETWEEN 1 AND 10000"}
leakage_checks: >
  The read-back recomputes lag_1h and lag_24h by joining traffic_hourly_v1 on hour_start_utc - 1 h / - 24 h
  and requires an exact match; tests/data_quality/test_products.py checks on a synthetic series that no
  feature changes when FUTURE values change.
production:
  command: bash scripts/run_m4.sh products
  job: src/products/build_products.py --product traffic_features
  inputs: [hdfs:///datalake/gold/products/traffic_hourly/v1]
reading_instructions: |
  spark.read.parquet(".../traffic_features/v1/").where("split = 'train'")
  Use split for train/validation/test; drop rows with lags_complete = false or impute, as the model needs.
known_limitations:
  - "UCI gaps (11,976 absent hours) make lags NULL around gaps; see lags_complete."
  - "No weather features (not available at prediction time); a model wanting weather must join forecast data."
  - "One station; 2014-08 to 2015-06 is a long gap inside the train split."
