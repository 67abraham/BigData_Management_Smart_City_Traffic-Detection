# Spark defaults for jobs submitted from the spark-master container (client mode). Spec T03/AC03, T06/AC06.
spark.master                      spark://spark-master:7077
spark.hadoop.fs.defaultFS         hdfs://namenode:8020
spark.executor.memory             1g
spark.executor.cores              1
spark.driver.memory               1g
spark.sql.session.timeZone        UTC
spark.sql.shuffle.partitions      8
spark.sql.adaptive.enabled        true
# Event log on HDFS -> Spark History Server (AC03 execution evidence).
spark.eventLog.enabled            true
spark.eventLog.dir                hdfs://namenode:8020/spark-events
spark.history.fs.logDirectory     hdfs://namenode:8020/spark-events
