# Silver / quality configuration (spec T03, T05). Rule logic lives in src/quality/; the
# thresholds, units and semantics live here so they are reviewable without reading code.
#
# Outcome per record (worst rule severity wins):
#   reject     -> outcome=rejected   structurally unusable (no key, unparseable, impossible type)
#   quarantine -> outcome=quarantine parseable but suspicious; kept for review, not published
#   flag       -> outcome=accepted   accepted, with the rule name kept in _violations

uci_metro:
  silver_dataset: uci_traffic_hourly
  version: v1
  # Station facts: UCI dataset page ("I-94 ATR 301 reported westbound traffic volume");
  # coordinates come from data/manifests/atr301_location.json (MnDOT), never hard-coded.
  station:
    id: "301"
    road: I-94
    direction: westbound
  # UCI gives local wall-clock time with no offset. M1 profile: the spring-forward 02:00 hour is
  # absent in every year 2012-2018, so the times follow US Central time with DST.
  timezone: America/Chicago
  timestamp_format: "yyyy-MM-dd HH:mm:ss"
  # Documented source period (UCI page: 2012-2018). Timestamps outside it are quarantined.
  coverage_start_local: "2012-01-01 00:00:00"
  coverage_end_local: "2018-12-31 23:00:00"
  expected_source_files: [Metro_Interstate_Traffic_Volume.csv.gz]
  units:   # as described on the UCI dataset page
    traffic_volume: vehicles/hour
    temp: K
    rain_1h: mm
    snow_1h: mm
    clouds_all: percent
  ranges:
    # Sanity bounds, not capacity estimates. Values outside are quarantined (negative volume rejected).
    traffic_volume_max: 10000     # max observed in M1 was 7,280
    temp_k_min: 223.15            # -50 degC; M1 found 10 rows with 0 K
    temp_k_max: 333.15            # +60 degC
    rain_1h_mm_max: 305.0         # ~ world-record 1-hour rainfall; M1 found one row with 9,831.3 mm
    snow_1h_mm_max: 100.0
    clouds_all_min: 0
    clouds_all_max: 100

open_meteo:
  silver_dataset: open_meteo_hourly
  version: v1
  # Labels kept on every record (spec §4: distinguish reanalysis from station observations).
  model: era5
  data_kind: reanalysis
  grid_resolution_deg: 0.25        # ERA5 "0.25° (~25 km)" (Open-Meteo historical-weather docs)
  time_format: "yyyy-MM-dd'T'HH:mm"
  # Requested period comes from configs/sources.yaml (open_meteo.start_date/end_date), not repeated here.
  expected_timezone: GMT
  expected_utc_offset_seconds: 0
  # Must equal the response's hourly_units (checked per raw file; a mismatch fails the job).
  expected_units:
    temperature_2m: "°C"
    precipitation: mm
    rain: mm
    snowfall: cm
    cloud_cover: "%"
    weather_code: wmo code
    wind_speed_10m: km/h
  # "Valid time" per Open-Meteo docs: Instant, or "Preceding hour sum" (covers [time-1h, time)).
  valid_time:
    temperature_2m: instant
    cloud_cover: instant
    weather_code: instant
    wind_speed_10m: instant
    precipitation: preceding_hour_sum
    rain: preceding_hour_sum
    snowfall: preceding_hour_sum
  # The 29 "WMO Weather interpretation codes (WW)" listed in the Open-Meteo historical-weather docs.
  wmo_codes: [0, 1, 2, 3, 45, 48, 51, 53, 55, 56, 57, 61, 63, 65, 66, 67, 71, 73, 75, 77,
              80, 81, 82, 85, 86, 95, 96, 97, 99]
  ranges:                          # sanity bounds; outside -> quarantine
    temperature_2m_min: -60.0
    temperature_2m_max: 60.0
    precipitation_mm_max: 305.0
    snowfall_cm_max: 100.0
    cloud_cover_min: 0
    cloud_cover_max: 100
    wind_speed_10m_max: 250.0
    rain_above_precipitation_tolerance_mm: 0.05   # rain is part of precipitation

traffic_weather:
  gold_dataset: uci_traffic_weather_hourly
  version: v1
  # UCI gives no interval boundary ("Hour of the data collected"); assumed to be the hour START,
  # so a UCI hour covers [U, U+1h) in UTC. Instant ERA5 values are taken at U; preceding-hour sums
  # at U+1h (which cover [U, U+1h)). The job reports temperature correlations for other alignments.
  uci_hour_label: start
  alignment_check_offsets_hours: [-1, 0, 1]
