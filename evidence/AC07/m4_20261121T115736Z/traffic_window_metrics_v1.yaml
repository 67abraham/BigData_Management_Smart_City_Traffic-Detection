# Data contract (spec T07, §7). Hand-written part; `release` is generated by src/products/release.py.
name: traffic_window_metrics
version: v1
release_level: R1   # verified student-produced version; no course R0 baseline was supplied
description: >
  Event-time window metrics of the I-94 / ATR 301 hourly volumes, computed by the Flink job over a
  HISTORICAL EVENT REPLAY of traffic data (not live data): one final row per 6-hour tumbling window.
consumers: [streaming analytics, dashboard]
location:
  path: hdfs://namenode:8020/datalake/gold/products/traffic_window_metrics/v1/
  format: parquet
  partitioning: [window_year]
granularity: one row per (station, 6-hour event-time window)
primary_key: [station_id, window_start_utc]
time_semantics: >
  Event time = UCI hour start in UTC. Tumbling windows [window_start_utc, window_end_utc) of 6 h aligned to
  00/06/12/18 UTC. Watermark = max event time - 60 min. A window first fires when the watermark passes its
  end (on_time); events arriving up to 6 h later (allowed lateness) make it fire again with update_seq 1, 2, ...
  Later events go to the DLQ (too_late). This product keeps the LAST firing of each window (highest update_seq).
late_event_handling: allowed lateness 6 h -> late_update (update_seq + 1, full corrected result); later -> DLQ too_late; out-of-orderness up to 60 min counted on time
spatial_coverage: one point, ATR 301 I-94 westbound
temporal_coverage: windows from the replayed hours (see release)
sources:
  - name: Flink window results of historical event replay (this platform)
    url: docs/streaming.md
    licence: CC BY 4.0 (derived from UCI Metro Interstate Traffic Volume)
licence: CC BY 4.0 (derived from UCI, DOI 10.24432/C5X60B)
lineage: Silver uci_traffic_hourly v1 -> replay_producer (Kafka uci-traffic-replay-v1) -> Flink job -> Kafka uci-traffic-window-metrics-v1 -> collected JSONL -> upsert by (station, window) -> this product
fields:
  - {name: station_id, type: string, nullable: false, description: "ATR station id"}
  - {name: window_start_utc, type: timestamp, nullable: false, description: "window start (key)"}
  - {name: window_end_utc, type: timestamp, nullable: false, description: "window end (exclusive)"}
  - {name: window_size_hours, type: int, unit: hours, nullable: false, description: "6"}
  - {name: event_count, type: int, nullable: false, description: "hourly events in the window after de-duplication"}
  - {name: expected_events, type: int, nullable: false, description: "6 (one per hour)"}
  - {name: completeness, type: double, nullable: false, description: "event_count / expected_events"}
  - {name: volume_sum, type: bigint, unit: vehicles, nullable: false, description: "sum of hourly volumes in the window"}
  - {name: volume_avg, type: double, unit: vehicles/hour, nullable: false, description: "mean hourly volume"}
  - {name: volume_min, type: int, unit: vehicles/hour, nullable: false, description: "min hourly volume"}
  - {name: volume_max, type: int, unit: vehicles/hour, nullable: false, description: "max hourly volume"}
  - {name: final_firing, type: string, nullable: false, description: "firing of the kept row: on_time | late_update"}
  - {name: final_update_seq, type: int, nullable: false, description: "update_seq of the kept row (0 = on time)"}
  - {name: firings_seen, type: int, nullable: false, description: "result rows received for this window (incl. re-emissions)"}
  - {name: watermark_at_emit, type: string, nullable: false, description: "watermark when the kept row was emitted (UTC)"}
  - {name: record_kind, type: string, nullable: false, description: '"historical_event_replay_window"'}
  - {name: source_topic, type: string, nullable: false, description: "Kafka topic the events came from"}
  - {name: job_run_id, type: string, nullable: false, description: "Flink job run that produced the results"}
  - {name: _product_run_id, type: string, nullable: false, description: "run that built this product"}
  - {name: window_year, type: int, nullable: false, description: "partition column, year of window_start_utc"}
quality_rules:
  - {name: window_6h, rule: "window_size_hours = 6 AND window_end_utc = window_start_utc + INTERVAL 6 HOURS"}
  - {name: aligned, rule: "hour(window_start_utc) % 6 = 0 AND minute(window_start_utc) = 0"}
  - {name: counts_range, rule: "event_count BETWEEN 1 AND 6 AND expected_events = 6 AND abs(completeness - event_count / 6.0) < 0.0001"}
  - {name: stats_consistent, rule: "volume_min <= volume_avg AND volume_avg <= volume_max AND abs(volume_sum - volume_avg * event_count) < 0.01 * event_count"}
  - {name: replay_labelled, rule: "record_kind = 'historical_event_replay_window'"}
production:
  command: bash scripts/run_m3.sh replay && bash scripts/run_m4.sh products
  job: src/products/build_products.py --product traffic_window_metrics --window-run <m3 replay run id>
  inputs: [data/local/m3/<run>/replay_metrics.jsonl (records consumed from uci-traffic-window-metrics-v1)]
reading_instructions: |
  spark.read.parquet(".../traffic_window_metrics/v1/")
  Key (station_id, window_start_utc). Windows with completeness < 1 have missing hours (UCI gaps).
  To consume the live Kafka topic instead, apply the same rule: keep the highest update_seq per key.
known_limitations:
  - "Built from a historical event replay, not live sensor data."
  - "Windows only exist where at least one hour was replayed; no rows for empty 6-hour periods."
  - "Results reflect one replay run (job_run_id); a new replay produces a new release."
