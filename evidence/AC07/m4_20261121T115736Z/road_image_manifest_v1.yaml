# Data contract (spec T07, §7). Hand-written part; `release` is generated by src/products/release.py.
name: road_image_manifest
version: v1
release_level: R1   # verified student-produced version; no course R0 baseline was supplied
description: >
  Manifest of the KITTI 2D object detection TRAINING images: one row per image id with its controlled
  storage path, size/format, checksum, label file and label summary, and whether the image file is
  available in this platform. Images are NOT redistributed (licence); only metadata is published.
consumers: [Computer Vision course (data loading)]
location:
  path: hdfs://namenode:8020/datalake/gold/products/road_image_manifest/v1/
  format: parquet
  partitioning: []
  copy: data/manifests/road_image_manifest_v1.csv   # same rows, committed to the repository (metadata only)
granularity: one row per KITTI training image id
primary_key: [image_id]
time_semantics: not time-indexed (single benchmark release)
spatial_coverage: Karlsruhe, Germany (KITTI recordings); unrelated to the traffic products
temporal_coverage: KITTI object benchmark release (recordings 2011)
sources:
  - name: KITTI Vision Benchmark Suite, 2D object detection (training split)
    url: https://www.cvlibs.net/datasets/kitti/eval_object.php
    licence: CC BY-NC-SA 3.0 (non-commercial; access needs a registered account)
licence: CC BY-NC-SA 3.0 - non-commercial use, attribution, share-alike; images may not be redistributed through this repository
lineage: KITTI archives (labels full, 500 images by HTTP range reads) -> Bronze kitti raw + records + image_inventory -> this product
fields:
  - {name: image_id, type: string, nullable: false, description: "six-digit KITTI id, e.g. \"000123\" (key)"}
  - {name: split, type: string, nullable: false, description: '"training" (only the training split has labels)'}
  - {name: file_available, type: boolean, nullable: false, description: "image file is stored in this platform (500 sampled ids)"}
  - {name: image_path, type: string, nullable: true, description: "controlled HDFS path of the PNG; NULL if not available"}
  - {name: image_format, type: string, nullable: false, description: '"png"'}
  - {name: image_bytes, type: bigint, unit: bytes, nullable: true, description: "file size; NULL if not available"}
  - {name: width_px, type: int, unit: pixels, nullable: true, description: "PNG width from the IHDR header"}
  - {name: height_px, type: int, unit: pixels, nullable: true, description: "PNG height"}
  - {name: image_sha256, type: string, nullable: true, description: "SHA-256 of the stored PNG"}
  - {name: label_path, type: string, nullable: false, description: "label file: <HDFS path of data_object_label_2.zip>!training/label_2/<id>.txt"}
  - {name: label_bytes, type: bigint, unit: bytes, nullable: false, description: "label file size"}
  - {name: label_lines, type: bigint, nullable: false, description: "annotation lines in the label file"}
  - {name: object_count, type: bigint, nullable: false, description: "annotated objects excluding DontCare regions"}
  - {name: dontcare_count, type: bigint, nullable: false, description: "DontCare regions"}
  - {name: object_types, type: "array<string>", nullable: false, description: "distinct object types in the image (sorted)"}
  - {name: origin, type: string, nullable: false, description: "dataset and split the row comes from"}
  - {name: label_archive_sha256, type: string, nullable: false, description: "SHA-256 of data_object_label_2.zip as downloaded"}
  - {name: _product_run_id, type: string, nullable: false, description: "run that built this product"}
quality_rules:
  - {name: id_format, rule: "image_id RLIKE '^[0-9]{6}$'"}
  - {name: available_has_file_facts, rule: "file_available = (image_path IS NOT NULL AND image_bytes > 0 AND width_px > 0 AND height_px > 0 AND length(image_sha256) = 64)"}
  - {name: label_counts_consistent, rule: "object_count + dontcare_count = label_lines"}
  - {name: format_png, rule: "image_format = 'png' AND split = 'training'"}
production:
  command: bash scripts/run_m4.sh products
  job: src/products/build_products.py --product road_image_manifest
  inputs: [hdfs:///datalake/bronze/kitti/image_inventory, hdfs:///datalake/bronze/kitti/records]
reading_instructions: |
  spark.read.parquet(".../road_image_manifest/v1/").where("file_available")   # rows with a stored image
  Or the CSV copy data/manifests/road_image_manifest_v1.csv (no Spark needed).
  Read an image: hdfs dfs -get <image_path>. Labels: unzip <label_path> member (KITTI label format: type,
  truncated, occluded, alpha, bbox x4, dimensions x3, location x3, rotation_y).
known_limitations:
  - "Only 500 of 7,481 training images are stored (deterministic sample, seed 241091038); the rest are listed with file_available = false."
  - "Testing split not included (no labels)."
  - "Non-commercial licence: consumers must hold their own KITTI access to use the images."
